<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>白熊傳說：眾神的降噪秘笈 | Zelda Retro RPG</title>
  <meta name="description" content="任天堂經典紅白機/超任風格像素 RPG！操控勇者白熊，砍草找寶石、揮劍驅逐內耗怪、開寶箱獲取降噪秘笈！">
  <!-- Retro Pixel Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      background: #080a10;
      color: #ffffff;
      font-family: 'Press Start 2P', 'Noto Sans TC', monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    /* NES / Game Boy Outer Bezel & TV Frame */
    .retro-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 640px;
      max-height: 960px;
      display: flex;
      flex-direction: column;
      background: #121622;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
      border-radius: 12px;
      overflow: hidden;
    }

    /* ===== CLASSIC ZELDA TOP HUD BAR ===== */
    .zelda-hud {
      background: #000000;
      border-bottom: 4px solid #3b4252;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
      height: 64px;
    }

    .hud-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .hud-minimap {
      width: 48px;
      height: 44px;
      border: 2px solid #4c566a;
      background: #1a1e2a;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 2px;
      padding: 2px;
    }
    .map-cell {
      background: #2e3440;
      border-radius: 1px;
    }
    .map-cell.active {
      background: #a3be8c;
      box-shadow: 0 0 6px #a3be8c;
      animation: blinkCell 1s infinite;
    }

    .hud-rupees {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: #a3be8c;
    }
    .rupee-icon {
      width: 14px;
      height: 20px;
      background: #a3be8c;
      clip-path: polygon(50% 0%, 100% 30%, 100% 70%, 50% 100%, 0% 70%, 0% 30%);
      box-shadow: 0 0 8px rgba(163, 190, 140, 0.8);
      display: inline-block;
    }

    .hud-items {
      display: flex;
      gap: 8px;
    }
    .item-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .slot-key {
      font-size: 0.5rem;
      color: #88c0d0;
    }
    .slot-box {
      width: 32px;
      height: 32px;
      border: 2px solid #88c0d0;
      background: #1e222d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    .hud-hearts {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .pixel-heart {
      width: 16px;
      height: 16px;
      background-size: contain;
      background-repeat: no-repeat;
      display: inline-block;
      color: #bf616a;
      font-size: 1rem;
      line-height: 1;
    }

    /* ===== GAME CANVAS (Pixel-art rendering) ===== */
    .canvas-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
      background: #2e3440;
      overflow: hidden;
    }

    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Scanlines / CRT Filter Overlay */
    .crt-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
      z-index: 10;
    }

    /* ===== RETRO DIALOGUE BOX ===== */
    .dialogue-box {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      background: #000000;
      border: 4px solid #ffffff;
      border-radius: 4px;
      padding: 12px 14px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
      z-index: 30;
      display: none;
      flex-direction: column;
      gap: 8px;
    }
    .dialogue-box.active {
      display: flex;
    }
    .dialogue-speaker {
      font-size: 0.65rem;
      color: #ebcb8b;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dialogue-text {
      font-size: 0.68rem;
      line-height: 1.6;
      color: #eceff4;
      min-height: 2.8em;
    }
    .dialogue-hint {
      align-self: flex-end;
      font-size: 0.48rem;
      color: #88c0d0;
      animation: blink 0.8s infinite;
    }

    /* ===== MOBILE VIRTUAL GAMEPAD (Nintendo Style) ===== */
    .gamepad-container {
      background: #191d28;
      border-top: 4px solid #2e3440;
      padding: 12px 20px env(safe-area-inset-bottom, 16px) 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 180px;
      z-index: 20;
    }

    /* D-PAD (Cross) */
    .d-pad {
      position: relative;
      width: 120px;
      height: 120px;
    }
    .d-btn {
      position: absolute;
      width: 38px;
      height: 38px;
      background: #3b4252;
      border: 2px solid #2e3440;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d8dee9;
      font-size: 0.75rem;
      box-shadow: 0 3px 0 #1e222d;
      cursor: pointer;
    }
    .d-btn:active, .d-btn.pressed {
      background: #4c566a;
      transform: translateY(2px);
      box-shadow: 0 1px 0 #1e222d;
    }
    .d-btn.up { top: 0; left: 41px; }
    .d-btn.down { bottom: 0; left: 41px; }
    .d-btn.left { top: 41px; left: 0; }
    .d-btn.right { top: 41px; right: 0; }
    .d-center {
      position: absolute;
      top: 41px;
      left: 41px;
      width: 38px;
      height: 38px;
      background: #3b4252;
    }

    /* Action Buttons (A & B) */
    .action-buttons {
      display: flex;
      align-items: center;
      gap: 16px;
      transform: rotate(-15deg);
    }
    .btn-circle {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #bf616a;
      border: 3px solid #8f383e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: bold;
      box-shadow: 0 4px 0 #5e262a;
      cursor: pointer;
      position: relative;
    }
    .btn-circle:active, .btn-circle.pressed {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #5e262a;
    }
    .btn-circle.btn-b {
      background: #bf616a; /* Red attack button */
    }
    .btn-circle.btn-a {
      background: #d08770; /* Orange action button */
      margin-top: -20px;
    }
    .btn-label-sub {
      font-size: 0.4rem;
      color: rgba(255, 255, 255, 0.8);
      margin-top: 2px;
    }

    /* Desktop Keys Hint */
    .pc-keys-bar {
      font-size: 0.5rem;
      color: #64748b;
      text-align: center;
      padding: 4px;
      background: #0f121b;
    }

    /* Modal (Item Get / Victory) */
    .zelda-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 50;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;

    .zelda-modal.active {
      display: flex;
    }
    .modal-frame {
      background: #000;
      border: 4px solid #ebcb8b;
      padding: 20px;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 0 30px rgba(235, 203, 139, 0.4);
    }
    .modal-banner {
      width: 100%;
      border-radius: 4px;
      margin-bottom: 12px;
      border: 2px solid #ebcb8b;
    }
    .modal-item-title {
      font-size: 0.85rem;
      color: #ebcb8b;
      margin-bottom: 8px;
    }
    .modal-item-desc {
      font-size: 0.6rem;
      line-height: 1.6;
      color: #d8dee9;
      margin-bottom: 16px;
    }
    .modal-btn {
      background: #ebcb8b;
      color: #000;
      border: none;
      padding: 10px 16px;
      font-family: inherit;
      font-size: 0.65rem;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    @keyframes blinkCell {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>

  <!-- RETRO RPG ENGINE SCRIPT -->
  <script>
    /* ========================================================
     * 1. 8-BIT CHIPTUNE SOUND SYNTHESIZER (Web Audio API)
     * ======================================================== */
    class RetroAudio {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playSword() {
        if (!this.ctx) return;
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(320, t);
        osc.frequency.exponentialRampToValueAtTime(80, t + 0.12);
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.13);
      }
      playGrassCut() {
        if (!this.ctx) return;
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(450, t);
        osc.frequency.exponentialRampToValueAtTime(150, t + 0.1);
        gain.gain.setValueAtTime(0.25, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.11);
      }
      playRupee() {
        if (!this.ctx) return;
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(987.77, t);       // B5
        osc.frequency.setValueAtTime(1318.51, t + 0.06); // E6
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.18);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.2);
      }
      playHit() {
        if (!this.ctx) return;
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, t);
        osc.frequency.linearRampToValueAtTime(40, t + 0.15);
        gain.gain.setValueAtTime(0.4, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.16);
      }
      playChestFanfare() {
        // Iconic Zelda Treasure Jingle (4 ascending notes)
        if (!this.ctx) return;
        this.init();
        const t = this.ctx.currentTime;
        const notes = [
          { f: 440.00, dur: 0.15 }, // A4
          { f: 466.16, dur: 0.15 }, // A#4
          { f: 493.88, dur: 0.15 }, // B4
          { f: 523.25, dur: 0.45 }  // C5
        ];
        let offset = 0;
        notes.forEach(n => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(n.f, t + offset);
          gain.gain.setValueAtTime(0.3, t + offset);
          gain.gain.exponentialRampToValueAtTime(0.01, t + offset + n.dur);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t + offset);
          osc.stop(t + offset + n.dur + 0.05);
          offset += n.dur;
        });
      }
    }
    const audio = new RetroAudio();

    /* ========================================================
     * 2. PIXEL ART SPRITE GENERATION (16-Bit Crisp Graphics)
     * ======================================================== */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    // Sprite drawing helper: matrix of colored pixels
    function drawPixelMatrix(ctx, matrix, colorMap, ox, oy, scale = 2) {
      for (let r = 0; r < matrix.length; r++) {
        for (let c = 0; c < matrix[r].length; c++) {
          const char = matrix[r][c];
          if (char !== '.' && colorMap[char]) {
            ctx.fillStyle = colorMap[char];
            ctx.fillRect(ox + c * scale, oy + r * scale, scale, scale);
          }
        }
      }
    }

    // Hero: Link White Bear (綠帽白熊勇者)
    const BEAR_PALETTE = {

    // Bush (Cuttable Zelda Bush)
    const BUSH_PALETTE = {
      'L': '#7cb342', // Light green
      'M': '#558b2f', // Medium green
      'D': '#33691e', // Dark shadow
      'F': '#e91e63'  // Tiny pink flower
    };
    const SPRITE_BUSH = [
      "...MMMMMMMM.....",
      "..MLLLLLLLLMD...",
      ".MLLLLLFLLLLMD..",
      "MLLLLLLLLLLLLMD.",
      "MLLLLLLLLLLLLMD.",
      "MLLLFLLLLLLLLMD.",
      "MMLLLLLLLLLLMMD.",
      ".DMMLLLLLLMMDD..",
      "..DDMMMMMMDD....",
      "................"
    ];

    // Slime Monster (內耗史萊姆)
    const SLIME_PALETTE = {
      'P': '#ba68c8', // Purple slime
      'L': '#e1bee7', // Highlight
      'D': '#7b1fa2', // Dark shadow
      'K': '#212121', // Eyes
      'W': '#ffffff'  // Eye gleam
    };
    const SPRITE_SLIME = [
      ".....PPPP.......",
      "...PPLLLLPP.....",
      "..PLLLLLLLLPD...",
      ".PLLKWLLKWLLPD..",
      ".PLLKKLLKKLLPD..",
      "PLLLLLLLLLLLLPD.",
      "PLLLLLLLLLLLLPD.",
      "DPLLLLLLLLLLPDD.",
      ".DDPPPPPPPPDD...",
      "................"
    ];

    // Treasure Chest
    const CHEST_PALETTE = {
      'G': '#fbc02d', // Gold trim
      'W': '#6d4c41', // Wood
      'D': '#3e2723', // Shadow
      'K': '#000000', // Keyhole
      'S': '#ffffff'  // Sparkle
    };
    const SPRITE_CHEST_CLOSED = [
      "..GGGGGGGGGGGG..",
      ".GGWWWWWWWWWWGG.",
      "GWWWWWWWWWWWWWWG",
      "GGGGGGGKGGGGGGGG",
      "GWWWWWWWWWWWWWWG",
      "GWWWWWWWWWWWWWWG",
      "GWWWWWWWWWWWWWWG",
      "GGGGGGGGGGGGGGGG"
    ];

    /* ========================================================
     * 3. GAME STATE & MAP ENTITIES
     * ======================================================== */
    const TILE_SIZE = 16;
    let rupees = 0;
    let hearts = 3;
    let maxHearts = 3;

    // Player State
    const player = {
      x: 160,
      y: 130,
      w: 16,
      h: 16,
      speed: 1.8,
      dir: 'down',
      moving: false,
      walkFrame: 0,
      slashing: false,
      slashTimer: 0,
      invulnerable: 0
    };

    // Map Bushes (Cuttable)
    const bushes = [
      { x: 60, y: 80, cut: false },
      { x: 80, y: 80, cut: false },
      { x: 100, y: 80, cut: false },
      { x: 200, y: 80, cut: false },
      { x: 220, y: 80, cut: false },
      { x: 240, y: 80, cut: false },
      { x: 60, y: 160, cut: false },
      { x: 80, y: 160, cut: false },
      { x: 220, y: 160, cut: false },
      { x: 240, y: 160, cut: false }
    ];

    // Slime Enemies
    const enemies = [
      { x: 70, y: 110, w: 14, h: 12, vx: 0.6, vy: 0, hp: 2, flash: 0, alive: true },
      { x: 220, y: 110, w: 14, h: 12, vx: -0.6, vy: 0, hp: 2, flash: 0, alive: true }
    ];

    // Treasure Chest
    const chest = { x: 152, y: 55, w: 16, h: 16, opened: false };

    // NPC: Wise Old Bear in front of Temple
    const npc = { x: 152, y: 40, w: 16, h: 16 };

    // Floating Pickups (Rupees & Hearts dropped from bushes/enemies)
    const drops = [];

    // Particle FX (Leaves bursting from cut grass)
    const particles = [];

    /* ========================================================
     * 4. INPUT HANDLING (Keyboard & Virtual Touch Gamepad)
     * ======================================================== */
    const keys = { up: false, down: false, left: false, right: false };

    // Keyboard
    window.addEventListener('keydown', (e) => {
      audio.init();
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') keys.up = true;
      if (k === 's' || k === 'arrowdown') keys.down = true;
      if (k === 'a' || k === 'arrowleft') keys.left = true;
      if (k === 'd' || k === 'arrowright') keys.right = true;
      if (k === 'j' || k === ' ') swingSword();
      if (k === 'k' || k === 'e') interactAction();
    });

    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') keys.up = false;
      if (k === 's' || k === 'arrowdown') keys.down = false;
      if (k === 'a' || k === 'arrowleft') keys.left = false;
      if (k === 'd' || k === 'arrowright') keys.right = false;
    });

    // Touch D-Pad
    document.querySelectorAll('.d-btn').forEach(btn => {
      const dir = btn.dataset.dir;
      const start = (e) => {
        e.preventDefault();
        audio.init();
        keys[dir] = true;
        btn.classList.add('pressed');
      };
      const end = (e) => {
        e.preventDefault();
        keys[dir] = false;
        btn.classList.remove('pressed');
      };
      btn.addEventListener('touchstart', start, { passive: false });
      btn.addEventListener('touchend', end);
      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', end);
    });

    // Touch Buttons
    const btnB = document.getElementById('btnB');
    const btnA = document.getElementById('btnA');

    btnB.addEventListener('touchstart', (e) => { e.preventDefault(); audio.init(); swingSword(); }, { passive: false });
    btnB.addEventListener('mousedown', () => { audio.init(); swingSword(); });

    btnA.addEventListener('touchstart', (e) => { e.preventDefault(); audio.init(); interactAction(); }, { passive: false });
    btnA.addEventListener('mousedown', () => { audio.init(); interactAction(); });

    /* ========================================================
     * 5. GAMEPLAY ACTIONS
     * ======================================================== */
    function swingSword() {
      if (player.slashing) return;
      player.slashing = true;
      player.slashTimer = 10;
      audio.playSword();

      // Sword Hitbox in front of Bear
      let hx = player.x, hy = player.y, hw = 16, hh = 16;
      if (player.dir === 'up') { hy -= 14; hw = 18; hh = 14; }
      else if (player.dir === 'down') { hy += 16; hw = 18; hh = 14; }
      else if (player.dir === 'left') { hx -= 14; hw = 14; hh = 18; }
      else if (player.dir === 'right') { hx += 16; hw = 14; hh = 18; }

      // Check Bushes
      bushes.forEach(b => {
        if (!b.cut && hx < b.x + 16 && hx + hw > b.x && hy < b.y + 16 && hy + hh > b.y) {
          b.cut = true;
          audio.playGrassCut();
          // Spawn 4 flying leaf particles
          for (let i = 0; i < 6; i++) {
            particles.push({
              x: b.x + 8,
              y: b.y + 8,
              vx: (Math.random() - 0.5) * 2.5,
              vy: (Math.random() - 0.5) * 2.5 - 1,
              life: 18,
              color: Math.random() > 0.5 ? '#7cb342' : '#558b2f'
            });
          }
          // 65% chance of dropping Rupee or Heart!
          if (Math.random() < 0.65) {
            const isHeart = Math.random() < 0.25;
            drops.push({
              x: b.x + 4,
              y: b.y + 4,
              type: isHeart ? 'heart' : 'rupee',
              val: isHeart ? 1 : (Math.random() > 0.8 ? 5 : 1),
              timer: 0
            });
          }
        }
      });

      // Check Enemies
      enemies.forEach(en => {
        if (en.alive && hx < en.x + en.w && hx + hw > en.x && hy < en.y + en.h && hy + hh > en.y) {
          en.hp -= 1;
          en.flash = 8;
          audio.playHit();
          // Knockback
          en.x += (player.dir === 'right' ? 12 : (player.dir === 'left' ? -12 : 0));
          en.y += (player.dir === 'down' ? 12 : (player.dir === 'up' ? -12 : 0));

          if (en.hp <= 0) {
            en.alive = false;
            drops.push({ x: en.x, y: en.y, type: 'rupee', val: 5, timer: 0 });
          }
        }
      });
    }

    function interactAction() {
      // Check Dialogue Box
      const dBox = document.getElementById('dialogueBox');
      if (dBox.classList.contains('active')) {
        dBox.classList.remove('active');
        return;
      }

      // Check Chest
      const distToChest = Math.hypot((player.x + 8) - (chest.x + 8), (player.y + 8) - (chest.y + 8));
      if (distToChest < 24 && !chest.opened) {
        chest.opened = true;
        audio.playChestFanfare();
        rupees += 50;
        hearts = maxHearts;
        updateHUD();
        document.getElementById('itemModal').classList.add('active');
        return;
      }

      // Check Temple NPC / Entrance
      const distToNPC = Math.hypot((player.x + 8) - (npc.x + 8), (player.y + 8) - (npc.y + 8));
      if (distToNPC < 32) {
        audio.playRupee();
        dBox.classList.add('active');
        return;
      }
    }

    function updateHUD() {
      document.getElementById('rupeeVal').innerText = rupees;
      const hContainer = document.getElementById('heartsContainer');
      hContainer.innerHTML = '';
      for (let i = 0; i < maxHearts; i++) {
        const span = document.createElement('span');
        span.className = 'pixel-heart';
        span.innerText = i < hearts ? '❤️' : '🖤';
        hContainer.appendChild(span);
      }
    }

    /* ========================================================
     * 6. MAIN RETRO GAME LOOP
     * ======================================================== */
    function gameLoop() {
      // Movement
      let dx = 0, dy = 0;
      if (keys.up) { dy -= 1; player.dir = 'up'; }
      if (keys.down) { dy += 1; player.dir = 'down'; }
      if (keys.left) { dx -= 1; player.dir = 'left'; }
      if (keys.right) { dx += 1; player.dir = 'right'; }

      if (dx !== 0 || dy !== 0) {
        player.moving = true;
        const len = Math.hypot(dx, dy);
        player.x += (dx / len) * player.speed;
        player.y += (dy / len) * player.speed;
        player.walkFrame++;
      } else {
        player.moving = false;
      }

      // Clamp inside screen bounds
      player.x = Math.max(16, Math.min(canvas.width - 32, player.x));
      player.y = Math.max(32, Math.min(canvas.height - 32, player.y));

      // Slashing timer
      if (player.slashing) {
        player.slashTimer--;
        if (player.slashTimer <= 0) player.slashing = false;
      }

      // Invulnerable timer
      if (player.invulnerable > 0) player.invulnerable--;

      // Update Enemies
      enemies.forEach(en => {
        if (!en.alive) return;
        en.x += en.vx;
        if (en.x < 50 || en.x > 250) en.vx *= -1;
        if (en.flash > 0) en.flash--;

        // Player Collision (Damage)
        if (player.invulnerable === 0) {
          const dist = Math.hypot((player.x + 8) - (en.x + 7), (player.y + 8) - (en.y + 6));
          if (dist < 12) {
            hearts--;
            player.invulnerable = 40;
            audio.playHit();
            updateHUD();
            if (hearts <= 0) {
              hearts = 3; // Respawn
              player.x = 160;
              player.y = 180;
              updateHUD();
            }
          }
        }
      });

      // Update Drops
      drops.forEach((d, idx) => {
        d.timer++;
        const dist = Math.hypot((player.x + 8) - (d.x + 4), (player.y + 8) - (d.y + 4));
        if (dist < 14) {
          if (d.type === 'rupee') {
            rupees += d.val;
            audio.playRupee();
          } else {
            hearts = Math.min(maxHearts, hearts + 1);
            audio.playRupee();
          }
          updateHUD();
          drops.splice(idx, 1);
        }
      });

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // --- RENDER SCENE ---
      renderScene();

      requestAnimationFrame(gameLoop);
    }

    function renderScene() {
      // 1. Clear & Draw Grass Overworld
      ctx.fillStyle = '#43a047'; // Lush Zelda green
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Cobblestone Path to Temple
      ctx.fillStyle = '#a1887f';
      ctx.fillRect(144, 40, 32, canvas.height - 40);
      ctx.fillStyle = '#8d6e63';
      for (let y = 45; y < canvas.height; y += 16) {
        ctx.fillRect(148, y, 10, 8);
        ctx.fillRect(162, y + 6, 10, 8);
      }

      // Ancient Stone Temple Entrance (Top)
      ctx.fillStyle = '#78909c';
      ctx.fillRect(132, 10, 56, 32);
      ctx.fillStyle = '#1e293b'; // Doorway
      ctx.fillRect(148, 22, 24, 20);
      ctx.fillStyle = '#cfd8dc'; // Pillars
      ctx.fillRect(134, 14, 6, 26);
      ctx.fillRect(180, 14, 6, 26);

      // Trees Borders
      ctx.fillStyle = '#2e7d32';
      ctx.fillRect(0, 0, 32, canvas.height);
      ctx.fillRect(canvas.width - 32, 0, 32, canvas.height);

      // 2. Draw Bushes
      bushes.forEach(b => {
        if (!b.cut) {
          drawPixelMatrix(ctx, SPRITE_BUSH, BUSH_PALETTE, b.x, b.y, 1.5);
        } else {
          // Stumps
          ctx.fillStyle = '#795548';
          ctx.fillRect(b.x + 4, b.y + 8, 8, 4);
        }
      });

      // 3. Draw Treasure Chest
      if (!chest.opened) {
        drawPixelMatrix(ctx, SPRITE_CHEST_CLOSED, CHEST_PALETTE, chest.x, chest.y, 1.6);
      } else {
        // Opened chest
        ctx.fillStyle = '#4e342e';
        ctx.fillRect(chest.x, chest.y, 16, 12);
        ctx.fillStyle = '#ffd54f';
        ctx.fillRect(chest.x + 2, chest.y - 4, 12, 4);
      }

      // 4. Draw Drops
      drops.forEach(d => {
        const bob = Math.sin(d.timer * 0.15) * 2;
        if (d.type === 'rupee') {
          ctx.fillStyle = d.val > 1 ? '#e91e63' : '#a3be8c';
          ctx.fillRect(d.x + 2, d.y + bob, 6, 8);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(d.x + 3, d.y + 2 + bob, 2, 2);
        } else {
          ctx.fillStyle = '#e53935';
          ctx.font = '10px sans-serif';
          ctx.fillText('❤️', d.x, d.y + 8 + bob);
        }
      });

      // 5. Draw Enemies (Slimes)
      enemies.forEach(en => {
        if (!en.alive) return;
        if (en.flash > 0) {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(en.x, en.y, en.w, en.h);
        } else {
          drawPixelMatrix(ctx, SPRITE_SLIME, SLIME_PALETTE, en.x, en.y, 1.2);
        }
      });

      // 6. Draw Hero Bear
      if (player.invulnerable % 6 < 3) {
        const curSprite = (player.moving && Math.floor(player.walkFrame / 8) % 2 === 1) ? SPRITE_BEAR_WALK : SPRITE_BEAR_DOWN;
        drawPixelMatrix(ctx, curSprite, BEAR_PALETTE, player.x, player.y, 1.2);

        // Sword Slash Animation
        if (player.slashing) {
          ctx.fillStyle = '#64b5f6';
          if (player.dir === 'down') {
            ctx.fillRect(player.x - 4, player.y + 16, 24, 6);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(player.x, player.y + 17, 18, 3);
          } else if (player.dir === 'up') {
            ctx.fillRect(player.x - 4, player.y - 6, 24, 6);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(player.x, player.y - 5, 18, 3);
          } else if (player.dir === 'left') {
            ctx.fillRect(player.x - 8, player.y - 2, 6, 22);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(player.x - 7, player.y + 2, 3, 16);
          } else if (player.dir === 'right') {
            ctx.fillRect(player.x + 18, player.y - 2, 6, 22);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(player.x + 19, player.y + 2, 3, 16);
          }
        }
      }

      // 7. Draw Leaf Particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
      });
    }

    // Modal Continue button
    document.getElementById('continuePlayBtn').addEventListener('click', () => {
      document.getElementById('itemModal').classList.remove('active');
    });

    // Start Game
    updateHUD();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
