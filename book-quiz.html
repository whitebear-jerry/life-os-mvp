  /* 與 reading-map.html 同一套奶茶色；固定米色，不跟系統深淺色切換（link-page-conversion §0 第 1 條） */
  :root{
    --paper:#f6f0e4; --paper-2:#efe7d6; --card:#fdfaf4; --ink:#443527; --ink-soft:#7a6b58;

  }
  *{box-sizing:border-box}
  html{overflow-x:hidden}
  body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;margin:0}
  h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
  p{margin:0}
  a{color:inherit}
  img{display:block;max-width:100%}
  :focus-visible{outline:2px solid var(--gilt);outline-offset:3px;border-radius:4px}
  .num{font-family:var(--f-num);font-variant-numeric:lining-nums tabular-nums}

  .wrap{max-width:760px;margin:0 auto;padding:28px 20px 56px;display:grid;gap:26px}
  .eyebrow{font-size:13px;letter-spacing:.2em;color:var(--gilt);font-weight:700}
  .eyebrow a{text-decoration:none}
  .eyebrow a:hover{text-decoration:underline}
  .hero{display:grid;grid-template-columns:96px minmax(0,1fr);gap:18px 20px;align-items:center}
  .hero img{width:96px;aspect-ratio:2/3;object-fit:cover;border:1px solid var(--rule);box-shadow:var(--shadow);border-radius:2px}
  .hero h1{font-size:clamp(26px,5vw,36px);font-weight:900;letter-spacing:.03em}
  .hero .lead{margin-top:8px;color:var(--ink-soft);font-size:14.5px}

  .card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:22px;box-shadow:var(--shadow);display:grid;gap:14px;scroll-margin-block:16px}
  .card:focus{outline:none}
  .note{font-size:13px;color:var(--ink-soft)}
  .progress{height:6px;border-radius:999px;background:var(--paper-2);overflow:hidden}
  .progress i{display:block;height:100%;background:var(--gilt);transition:width .3s ease}
  .step{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);letter-spacing:.06em}
  .tag-multi{font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:1px 8px;border-radius:999px;border:1px solid var(--gilt);color:var(--gilt)}
  .q{font-family:var(--f-display);font-size:clamp(17px,2.4vw,20px);font-weight:700;line-height:1.6}
  .opts{display:grid;gap:10px}
  .opt{font:inherit;font-size:15px;line-height:1.55;text-align:left;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:10px;
    padding:12px 14px;min-height:48px;cursor:pointer;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;
    transition:border-color .15s ease,background-color .15s ease,transform .15s ease}
  .opt .mk{font-family:var(--f-num);font-weight:600;color:var(--ink-soft)}
  .opt:hover:not(:disabled){border-color:var(--gilt);background:#fffaf0;transform:translateY(-1px)}
  .opt[aria-pressed="true"]{border-color:var(--gilt);box-shadow:inset 0 0 0 1px var(--gilt)}
  .opt:disabled{cursor:default}
  .opt.is-correct{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok);background:#f3f8f2}
  .opt.is-correct .mk{color:var(--ok)}
  .opt.is-wrong{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad);background:#fbf2f0}
  .opt.is-wrong .mk{color:var(--bad)}
  .opt.is-dim{opacity:.72}   /* 答完後淡化其他選項，但仍要讀得清楚（實測對比約 4.6） */
  .hint summary{cursor:pointer;font-size:13.5px;color:var(--ink-soft);list-style:none;display:inline-flex;gap:6px;min-height:28px;align-items:center}
  .hint summary::-webkit-details-marker{display:none}
  .hint summary::before{content:"💡"}
  .hint p{margin-top:6px;font-size:14px;color:var(--ink-soft)}
  .explain{border-top:1px dashed var(--rule);padding-top:12px;display:grid;gap:10px}

  .verdict.bad{color:var(--bad)}
  .why{font-size:14px;line-height:1.7}

  .why span{color:var(--ink-soft)}

  .nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
  .btn{font:inherit;font-size:15px;font-weight:800;padding:11px 22px;min-height:46px;border-radius:10px;border:0;cursor:pointer;

  .link{font:inherit;font-size:13.5px;color:var(--ink-soft);background:none;border:0;padding:8px 0;cursor:pointer;text-decoration:underline}

  .score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .score b{font-family:var(--f-num);font-size:52px;line-height:1;color:var(--gilt);font-weight:600}
  .score span{font-size:15px;color:var(--ink-soft)}

  .next{font-size:14px;background:var(--paper);border:1px dashed var(--rule);border-radius:8px;padding:10px 12px}
  .goto{font-size:14px;font-weight:700;color:var(--c);text-decoration:none;border-bottom:1px solid var(--rule)}

  .mm-toggle{font:inherit;font-size:13.5px;font-weight:700;color:var(--c);background:var(--card);border:1px solid var(--rule);border-radius:999px;padding:7px 14px;min-height:38px;cursor:pointer}
  .mm-toggle[aria-pressed="true"]{background:var(--c);color:#fdfaf4;border-color:var(--c)}
  #mm-tree{display:grid;gap:8px}

  .mm-ch[open]>summary::after{content:"－"}

  .mm-sec{border-left:2px solid var(--rule);padding-left:10px;border-radius:2px}
  .mm-sec[open]{border-left-color:var(--c)}

  .mm-pts li.tool::before{background:var(--c)}
  .tool-chip{display:inline-block;font-size:11px;font-weight:700;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:0 6px;margin-left:4px;vertical-align:1px}
  .only-tools .mm-pts li:not(.tool),.only-tools details[data-tools="0"]{display:none}
  .mm-branch{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px 14px;align-items:center;padding:6px 0}
  .mm-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}

  .mm-col{display:grid;gap:10px;position:relative;z-index:1}
  .mm-hub{position:relative;z-index:1;display:grid;justify-items:center;gap:2px;text-align:center;background:var(--c);color:#fdfaf4;border-radius:14px;padding:12px 10px;min-width:64px}

  .mm-hub span{font-size:11px;line-height:1.45;opacity:.92}
  .mm-node{font:inherit;display:grid;gap:1px;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--rule);border-radius:10px;padding:8px 10px;min-height:44px;cursor:pointer;transition:border-color .15s ease,transform .15s ease}
  .mm-col.left .mm-node{text-align:right;justify-items:end}

  .mm-node .k{font-family:var(--f-num);font-size:12px;font-weight:600;color:var(--c)}
  .mm-node .s{font-family:var(--f-display);font-size:15px;font-weight:700;line-height:1.35}
  .mm-node .m{font-size:11.5px;line-height:1.4;color:var(--ink-soft);white-space:nowrap}
  .mm-node .m.t{color:var(--c);font-weight:700}
  .mm-hint{margin-top:-2px}
  @keyframes mmFlash{from{background:rgba(136,102,33,.16)}to{background:transparent}}
  .mm-flash{animation:mmFlash 1.6s ease}
  @media (max-width:420px){
    .mm-branch{gap:8px 10px}
    .mm-hub{min-width:64px;padding:10px 8px}
    .mm-hub b{font-size:19px}
    .mm-hub b.long{font-size:15px}
    .mm-node{padding:7px 8px}
    .mm-node .s{font-size:14px}
  }
  @media (prefers-reduced-motion:reduce){
    .mm-node{transition:none}
    .mm-node:hover{transform:none}
    .mm-flash{animation:none}
  }
  </style>
</head>

      html += '<div class="explain"><p class="verdict ' + (ok ? 'ok' : 'bad') + '">' + (ok ? '答對了！' : '這題再想想') + '</p>';
      order.forEach(function (k, pos) {
        var o = q.options[k];
        if (!o.ok && st.sel.indexOf(k) === -1) return;
        var tag = o.ok ? '✓ 正確答案' : '✗ 你選的';
        html += '<p class="why"><b>' + MARK[pos] + '　' + tag + '</b><span>' + esc(o.why) + '</span></p>';
      });
      html += '<p class="src"><em>出處</em>《' + esc(Q.title) + '》' + q.secs.map(function (s) { return esc(secLabel(s)); }).join('、') + '</p></div>' +
        '<div class="nav"><span></span><button class="btn" type="button" data-act="next">' + (st.i + 1 < N ? '下一題 →' : '看結果') + '</button></div>';
    }
    return html;
  }

  function renderResult() {
    var score = st.right.filter(Boolean).length;
    var msg = score >= 9 ? '這本書你讀得很透，裡面的工具已經是你的了。'
      : score >= 6 ? '大部分都掌握了。下面這幾節回去翻一下，就更完整了。'
      : (Q.encourage || '沒關係，答錯的地方就是最值得重讀的那幾節，先從下面開始。');
    var secs = [];
    Q.questions.forEach(function (q, i) {
      if (st.right[i]) return;
      q.secs.forEach(function (s) { if (secs.indexOf(s) === -1) secs.push(s); });
    });
    secs.sort(function (a, b) {
      var x = a.split('.').map(Number), y = b.split('.').map(Number);
      for (var i = 0; i < Math.max(x.length, y.length); i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) - (y[i] || 0); }
      return 0;
    });
    var html = '<div class="progress" aria-hidden="true"><i style="width:100%"></i></div>' +
      '<p class="score"><b>' + score + '</b><span>／ ' + N + ' 題答對</span></p>' +
      '<p class="msg">' + esc(msg) + '</p>';
    if (secs.length) {
      html += '<div class="review"><h3>回去重讀這幾節</h3><ul>' +
        secs.map(function (s) {
          var t = esc(Q.sections[s] || '');
          // 有全書地圖的書才做成按鈕，點下去會打開下面地圖的那一段
          return window.__HASMAP
            ? '<li><button class="mm-jump" type="button" data-sec="' + esc(s) + '"><span class="sec">' + esc(s) + '</span><span>' + t + '</span></button></li>'
            : '<li><span class="sec">' + esc(s) + '</span>' + t + '</li>';
        }).join('') +
        '</ul>' + (window.__HASMAP ? '<p class="note">點節名，下方的全書地圖會直接打開那一段。</p>' : '') + '</div>';
    }
    if (Q.next) html += '<p class="next">' + esc(Q.next) + ' <a class="goto" href="reading-map.html">看閱讀地圖 →</a></p>';
    html += '<div class="nav"><button class="link" type="button" data-act="restart">再做一次（選項順序會重新打亂）</button></div>';
    return html;
  }

  function render() {
    card.innerHTML = st.i < 0 ? renderIntro() : st.i < N ? renderQuestion() : renderResult();
  }

  function show() {
    render();
    try { card.focus({ preventScroll: true }); } catch (e) { card.focus(); }
    var r = card.getBoundingClientRect();
    if (r.top < 0 || r.top > window.innerHeight * 0.55) {
      card.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
    }
  }

  function settle() {
    st.answered = true;
    st.right[st.i] = isRight(Q.questions[st.i], st.sel);
  }

  card.addEventListener('click', function (e) {
    var t = e.target && e.target.closest ? e.target.closest('button') : null;
    if (!t || !card.contains(t) || t.disabled) return;
    var act = t.getAttribute('data-act');
    if (t.hasAttribute('data-k')) {
      var k = Number(t.getAttribute('data-k'));
      var q = Q.questions[st.i];
      if (q.multi) {
        var at = st.sel.indexOf(k);
        if (at === -1) st.sel.push(k); else st.sel.splice(at, 1);
        render();
      } else {
        st.sel = [k];
        settle();
        render();
      }
      return;
    }
    if (act === 'start' || act === 'restart') {
      reset();
      st.i = 0;
      track('bookquiz-' + key + '-start');
      show();
    } else if (act === 'check') {
      settle();
      render();
    } else if (act === 'next') {
      st.i += 1;
      st.sel = [];
      st.answered = false;
      if (st.i >= N) track('bookquiz-' + key + '-done-' + st.right.filter(Boolean).length);
      show();
    }
  });

  reset();
  render();
})();
</script>

(function () {
  var sec = document.getElementById('bookmap');
  var key = window.__QUIZKEY;
  if (!sec || !key || !BOOKMAPS[key]) return;        // 這本書還沒有地圖：維持 hidden
  var M = BOOKMAPS[key];
  window.__HASMAP = true;                            // 測驗結果的「回去重讀」才會做成按鈕
  sec.hidden = false;

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var root = document.getElementById('mm-tree'), br = document.getElementById('mm-branch'), tg = document.getElementById('mm-tools');
  function esc(x) { return String(x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function cnt(c) { var p = 0, t = 0; c.sections.forEach(function (x) { p += x.points.length; x.points.forEach(function (q) { if (q.tool) t++; }); }); return [p, t]; }
  function lab(c) { return c.label || ('第 ' + c.no + ' 章'); }
  function secId(s) { return 'mm-s-' + String(s).replace(/\./g, '-'); }

  function node(c) {
    var n = cnt(c);
    return '<button class="mm-node" type="button" data-ch="' + c.no + '" aria-label="' + esc(lab(c) + ' ' + c.title) + '">' +
      '<span class="k">' + esc(lab(c)) + '</span>' + (c.title ? '<span class="s">' + esc(c.title.split('：')[0]) + '</span>' : '') +
      '<span class="m">' + n[0] + ' 個重點</span>' + (n[1] ? '<span class="m t">工具 ' + n[1] + '</span>' : '') + '</button>';
  }

  // 分支線用 SVG 現畫：節點高度會隨字數變，寫死座標一定會歪
  function drawLines() {
    var svg = br.querySelector('.mm-lines'), hub = br.querySelector('.mm-hub');
    if (!svg || !hub) return;
    var B = br.getBoundingClientRect(), H = hub.getBoundingClientRect(), d = '';
    [].forEach.call(br.querySelectorAll('.mm-node'), function (n) {
      var r = n.getBoundingClientRect(), left = n.parentNode.classList.contains('left');
      var x1 = (left ? H.left : H.right) - B.left, y1 = H.top + H.height / 2 - B.top;
      var x2 = (left ? r.right : r.left) - B.left, y2 = r.top + r.height / 2 - B.top, mx = (x1 + x2) / 2;
      d += 'M' + x1 + ',' + y1 + ' C' + mx + ',' + y1 + ' ' + mx + ',' + y2 + ' ' + x2 + ',' + y2 + ' ';
    });
    svg.innerHTML = '<path d="' + d + '"/>';
  }

  var P = 0, T = 0, S = 0;
  M.chapters.forEach(function (c) { var n = cnt(c); P += n[0]; T += n[1]; S += c.sections.length; });
  // 七本書的層級不一樣：有的分部、有的分組（每組 5 章）、有的直接是章
  var unit = M.chapters[0].label && M.chapters[0].label.indexOf('部') !== -1 ? '部' : (M.chapters[0].title ? '章' : '組');
  var sunit = M.chapters[0].sections[0].label && M.chapters[0].sections[0].label.indexOf('章') !== -1 ? '章' : '節';
  var unitTxt = unit === '組' ? M.chapters.length + ' 組（每組 5 章）' : M.chapters.length + ' ' + unit;

  document.getElementById('bookmap-title').textContent = '《' + M.title + '》全書地圖';
  document.getElementById('mm-note').textContent = unitTxt + '、' + S + ' ' + sunit + '、' + P + ' 個重點，全部對照過原書。標「工具」的 ' + T + ' 個，是可以直接拿來用的自檢表、清單、步驟或練習。';
  tg.textContent = '只看工具（' + T + '）';

  var half = Math.ceil(M.chapters.length / 2);
  br.innerHTML = '<svg class="mm-lines" aria-hidden="true"></svg>' +
    '<div class="mm-col left">' + M.chapters.slice(0, half).map(node).join('') + '</div>' +
    '<div class="mm-hub"><b' + (M.title.length > 2 ? ' class="long"' : '') + '>' + esc(M.title) + '</b><span>' + M.chapters.length + ' ' + unit + '<br>' + P + ' 個重點</span></div>' +
    '<div class="mm-col right">' + M.chapters.slice(half).map(node).join('') + '</div>';

  var html = '';
  M.chapters.forEach(function (c) {
    var n = cnt(c);
    html += '<details class="mm-ch" id="mm-ch-' + c.no + '" data-tools="' + n[1] + '"><summary>' +
      '<span class="n">' + esc(lab(c)) + '</span><span class="t">' + esc(c.title || '') + '</span>' +
      '<span class="cnt">' + c.sections.length + ' ' + sunit + '・' + n[0] + ' 個重點</span></summary><div class="mm-secs">';
    c.sections.forEach(function (x) {
      var t = 0; x.points.forEach(function (p) { if (p.tool) t++; });
      html += '<details class="mm-sec" id="' + secId(x.sec) + '" data-tools="' + t + '"><summary>' +
        '<span class="sec">' + esc(x.label || x.sec) + '</span><span>' + esc(x.title) + '</span></summary><ul class="mm-pts">';
      x.points.forEach(function (p) {
        html += '<li' + (p.tool ? ' class="tool"' : '') + '>' + esc(p.t) + (p.tool ? ' <span class="tool-chip">工具</span>' : '') + '</li>';
      });
      html += '</ul></details>';
    });
    html += '</div></details>';
  });
  root.innerHTML = html;
  drawLines();

  function flash(el) { el.classList.remove('mm-flash'); void el.offsetWidth; el.classList.add('mm-flash'); }
  function toolsOff() { if (tg.getAttribute('aria-pressed') === 'true') tg.click(); }

  // 測驗結果給的節號可能比地圖細（例如 1.2.2），找不到就往上退一層
  function openSection(s) {
    var k = String(s), el = null;
    while (k && !(el = document.getElementById(secId(k)))) k = k.indexOf('.') === -1 ? '' : k.replace(/\.[^.]*$/, '');
    if (!el) return;
    toolsOff(); el.closest('.mm-ch').open = true; el.open = true;
    el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' }); flash(el);
  }

  document.addEventListener('click', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('.mm-jump') : null;
    if (b) openSection(b.getAttribute('data-sec'));
  });

  br.addEventListener('click', function (e) {
    var n = e.target.closest && e.target.closest('.mm-node');
    if (!n) return;
    var ch = document.getElementById('mm-ch-' + n.getAttribute('data-ch'));
    toolsOff(); ch.open = true;
    ch.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); flash(ch);
  });

  tg.addEventListener('click', function () {
    var on = tg.getAttribute('aria-pressed') !== 'true';
    tg.setAttribute('aria-pressed', String(on)); root.classList.toggle('only-tools', on);
    [].forEach.call(root.querySelectorAll('details'), function (d) { d.open = on ? d.getAttribute('data-tools') !== '0' : false; });
  });

  // 字型載完、容器寬度一變，分支線都要重畫
  if (window.ResizeObserver) new ResizeObserver(drawLines).observe(br); else window.addEventListener('resize', drawLines);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawLines);
})();
</script>

<script>
/* ──────────────────────────────────────────────────────────────
   圖片 CDN 退路：jsDelivr 掛掉時自動改用同 repo 的本地 assets/
   - 涵蓋靜態 <img>、JS 後來插入的 <img>、以及 CSS 背景圖
   - 只在載入失敗時才動作，正常情況完全沒有成本
   ────────────────────────────────────────────────────────────── */
(function () {
  var CDN = 'https://cdn.jsdelivr.net/gh/whitebear-jerry/life-os-mvp@7631055693f4cb949ae20810db76b618d638e670/assets/';
  function toLocal(u) {
    if (!u) return null;
    var i = u.indexOf(CDN);
    return i === -1 ? null : 'assets/' + u.slice(i + CDN.length);
  }
  function guard(img) {
    if (!img || img.dataset.cdnFb) return;
    img.dataset.cdnFb = '1';
    img.addEventListener('error', function () {
      var l = toLocal(img.src);
      if (l) img.src = l;                 // 換本地路徑後不再重試，避免無限迴圈
    });
    // 腳本載入前就已失敗的圖，補救一次
    if (img.complete && img.naturalWidth === 0) {
      var l = toLocal(img.src);
      if (l) img.src = l;
    }
  }
  [].forEach.call(document.images, guard);

  // JS 後來才插進 DOM 的圖（閱讀地圖、工具頁的推薦書封都是這種）
  if (window.MutationObserver) {
    new MutationObserver(function (ms) {
      ms.forEach(function (m) {
        [].forEach.call(m.addedNodes, function (n) {
          if (!n || n.nodeType !== 1) return;
          if (n.tagName === 'IMG') guard(n);
          else if (n.querySelectorAll) [].forEach.call(n.querySelectorAll('img'), guard);
        });
      });
    }).observe(document.documentElement, { childList: true, subtree: true });
  }

  // CSS 背景圖沒有 error 事件，改用探測：載不起來就把元素的背景換成本地路徑
  window.__cdnBgFallback = function (el, url) {
    var probe = new Image();
    probe.onerror = function () {
      var l = toLocal(url);
      if (l) el.style.backgroundImage = "url('" + l + "')";
    };
    probe.src = url;
  };
})();
</script>
