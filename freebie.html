    <title>人生降噪一頁表｜Life OS MVP</title>
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">Life OS</a>
      <nav aria-label="主要導覽">
        <a href="index.html#quiz">免費測驗</a>
        <a href="freebie.html" aria-current="page">人生降噪一頁表</a>
        <a href="offer.html">模板包</a>
        <a href="product-ladder.html">產品階梯</a>
      </nav>
    </header>

    <main>
      <section class="page-hero two-col">
        <div>
          <p class="kicker">免費贈品</p>
          <h1>人生降噪一頁表</h1>
          <p class="lead">這不是一張漂亮表格而已。它的任務是讓讀者第一次把腦中的焦慮、待辦、情緒和人際消耗倒出來，感覺到「我可以被整理」。</p>
          <div class="hero-actions">
            <a class="button primary" href="templates/人生降噪一頁表.md">打開可複製 Markdown</a>
            <a class="button ghost" href="offer.html">下一步：模板包</a>
          </div>
        </div>
        <figure class="feature-image">
          <img src="assets/auto-navigation.jpg" alt="自動導航系統示意圖">
          <figcaption>從硬撐意志力，改成安裝自動導航系統。</figcaption>
        </figure>
      </section>

      <section class="worksheet-preview" aria-labelledby="worksheet-title">
        <div class="section-heading">
          <p class="kicker">交付內容</p>
          <h2 id="worksheet-title">一頁表填寫區</h2>
          <p>這版可直接截圖、改成 PDF，或搬進 Google Form / Notion。</p>
        </div>
        <div class="worksheet">
          <label>1. 我現在最大的雜訊是</label>
          <div class="write-line"></div>
          <label>2. 這個雜訊屬於哪一類</label>
          <div class="check-grid">
            <span>□ 願望不清</span>
            <span>□ 逆境加戲</span>
            <span>□ 界線漏電</span>
            <span>□ 大腦爆滿</span>
          </div>
          <label>3. 我今天能做的最小一步是</label>
          <div class="write-line"></div>
          <label>4. 我需要停止做的一件事是</label>
          <div class="write-line"></div>
          <label>5. 我要放進第二大腦的內容是</label>
          <div class="write-line"></div>
          <label>6. 我今晚要確認的一句話是</label>
          <div class="write-line"></div>
        </div>
      </section>

      <section class="next-step-panel">
        <div>
          <p class="kicker">測試 CTA</p>
          <h2>如果讀者填完後覺得變清楚，就推 45 天模板包。</h2>
          <p>免費表只負責「第一次降噪」。付費產品負責把這個動作變成 45 天系統。</p>
        </div>
        <a class="button primary" href="offer.html">查看付費模板包</a>
      </section>
    </main>
