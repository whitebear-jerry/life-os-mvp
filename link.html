<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>白熊人生攻略｜Life OS</title>
  <meta name="description" content="白熊人生攻略：把人生變成可以升級的作業系統。">
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    :root {
      color-scheme: dark;
    }

    body.link-page {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(47, 107, 79, 0.38), transparent 34rem),
        linear-gradient(180deg, #0c1511 0%, #121912 52%, #17201a 100%);
      color: #f7f7f0;
    }

    .link-shell {
      width: min(100%, 520px);
      margin: 0 auto;
      padding: 28px 18px 30px;
    }

    .link-profile {
      display: grid;
      justify-items: center;
      gap: 10px;
      text-align: center;
      padding: 12px 0 20px;
    }

    .bear-avatar {
      width: 82px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.96), rgba(224, 232, 220, 0.9));
      color: var(--green-dark);
      font-weight: 950;
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.28);
    }

    .link-profile h1 {
      max-width: 100%;
      font-size: 1.72rem;
      line-height: 1.12;
    }

    .link-tagline {
      margin: 0;
      color: rgba(247, 247, 240, 0.78);
      font-size: 0.98rem;
      line-height: 1.55;
    }

    .link-books {
      display: grid;
      gap: 12px;
    }

    .link-book {
      padding: 18px 16px;
      border: 1px solid rgba(220, 227, 217, 0.16);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.16);
      transition: border-color 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
    }

    .link-book:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .link-book.book-fuli:hover {
      border-color: rgba(196, 137, 53, 0.35);
      box-shadow: 0 16px 48px rgba(196, 137, 53, 0.06);
    }

    .link-book.book-game:hover {
      border-color: rgba(160, 79, 85, 0.35);
      box-shadow: 0 16px 48px rgba(160, 79, 85, 0.06);
    }

    .link-book.book-noise:hover {
      border-color: rgba(64, 105, 132, 0.35);
      box-shadow: 0 16px 48px rgba(64, 105, 132, 0.06);
    }

    .link-book h2 {
      font-size: 1.06rem;
      line-height: 1.28;
    }

    .link-book p {
      margin: 8px 0 0;
      color: rgba(247, 247, 240, 0.72);
      font-size: 0.88rem;
      line-height: 1.55;
    }

    .link-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 14px;
    }

    .link-actions a {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 800;
      text-decoration: none;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), 
                  box-shadow 0.2s cubic-bezier(0.16, 1, 0.3, 1), 
                  filter 0.2s cubic-bezier(0.16, 1, 0.3, 1), 
                  border-color 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .book-fuli .link-actions a {
      background: var(--gold);
      box-shadow: 0 4px 12px rgba(196, 137, 53, 0.15);
    }

    .book-game .link-actions a {
      background: var(--rose);
      box-shadow: 0 4px 12px rgba(160, 79, 85, 0.15);
    }

    .book-noise .link-actions a {
      background: var(--blue);
      box-shadow: 0 4px 12px rgba(64, 105, 132, 0.15);
    }

    .link-actions a:hover {
      filter: brightness(1.12);
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.32);
    }

    .book-fuli .link-actions a:hover {
      box-shadow: 0 8px 24px rgba(196, 137, 53, 0.35);
    }

    .book-game .link-actions a:hover {
      box-shadow: 0 8px 24px rgba(160, 79, 85, 0.35);
    }

    .book-noise .link-actions a:hover {
      box-shadow: 0 8px 24px rgba(64, 105, 132, 0.35);
    }

    .link-actions a:active {
      transform: translateY(0);
      filter: brightness(0.95);
    }

    .link-actions a:focus-visible {
      outline: 3px solid rgba(255, 255, 255, 0.6);
      outline-offset: 3px;
    }

    .link-more {
      margin: 20px 0 0;
      padding: 14px 0 0;
      border-top: 1px solid rgba(220, 227, 217, 0.16);
      color: rgba(247, 247, 240, 0.7);
      font-size: 0.9rem;
      text-align: center;
    }

    @media (max-width: 480px) {
      .link-shell {
        padding-inline: 14px;
      }

      .link-actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

    <p class="link-more">更多內容 → IG / YouTube</p>
  </main>
</body>
</html>
