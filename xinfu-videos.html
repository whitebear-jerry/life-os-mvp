  }
  var parts = [];
  VIDEOS.forEach(function (v) {

  document.getElementById('index').innerHTML = parts.map(function (p, i) {

  }).join('');
  document.getElementById('list').innerHTML = parts.map(function (p, i) {

/* ──────────────────────────────────────────────────────────────
   圖片 CDN 退路：jsDelivr 掛掉時自動改用同 repo 的本地 assets/
   （與其他頁同一份；這頁只有書封走 jsDelivr）

(function () {
  var CDN = 'https://cdn.jsdelivr.net/gh/whitebear-jerry/life-os-mvp@7631055693f4cb949ae20810db76b618d638e670/assets/';
  function toLocal(u) {
    if (!u) return null;
    var i = u.indexOf(CDN);
    return i === -1 ? null : 'assets/' + u.slice(i + CDN.length);
  }
  function guard(img) {
    if (!img || img.dataset.cdnFb) return;
    img.dataset.cdnFb = '1';
    img.addEventListener('error', function () {
      var l = toLocal(img.src);
      if (l) img.src = l;                 // 換本地路徑後不再重試，避免無限迴圈
    });
    if (img.complete && img.naturalWidth === 0) {
      var l = toLocal(img.src);
      if (l) img.src = l;
    }
  }
  [].forEach.call(document.images, guard);
  if (window.MutationObserver) {
    new MutationObserver(function (ms) {
      ms.forEach(function (m) {
        [].forEach.call(m.addedNodes, function (n) {
          if (!n || n.nodeType !== 1) return;

    var probe = new Image();

    };
    probe.src = url;
  };
})();
