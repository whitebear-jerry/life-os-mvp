(function () {

    href: 'link.html#book-mingbian',
    stores: [
      ['readmoo', '📖 Readmoo', 'https://readmoo.com/book/210510318000101'],
      ['pubu', '📚 Pubu', 'https://www.pubu.com.tw/ebook/706027?apKey=e08e864a73'],
      ['kobo', '📕 Kobo', 'https://www.kobo.com/tw/zh/ebook/BXq4v8w-qzmB3kmH_KVHwA?sId=8279bf42-8d3d-45b9-87e1-548dbae7f90f&ssId=hg4dlbrf47Cfsj6VCzbgz&cPos=3']
    ]
  };
  var CAT_ORDER = ['talk', 'bias', 'crowd'];
  var Q = MIRROR.questions, N = Q.length;
  var card = document.getElementById('mirror');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var st;

  function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function track(name) { try { if (window.clarity) clarity('event', name); } catch (e) {} }
  function shuffled(n) {
    // 正解在資料裡都排第一個，每次作答都要打亂
    var a = []; for (var i = 0; i < n; i++) a.push(i);
    for (var j = n - 1; j > 0; j--) { var k = Math.floor(Math.random() * (j + 1)); var t = a[j]; a[j] = a[k]; a[k] = t; }
    return a;
  }
  function reset() { st = { i: -1, pick: null, right: [], order: Q.map(function (q) { return shuffled(q.options.length); }) }; }

  function renderIntro() {
    return '<ul class="intro-list">' +
      '<li>每題一個生活情境：主管開會、家族群組、超市、排隊、看球賽</li>' +
      '<li>四個選項選一個：這裡藏的是哪一招？</li>' +
      '<li>答完馬上告訴你為什麼，以及出自《明辨》哪一節</li>' +
      '</ul>' +
      '<div class="nav"><button class="btn" type="button" data-act="start">開始照照看 ➔</button></div>';
  }

  function renderQuestion() {
    var q = Q[st.i], cat = MIRROR.categories[q.cat], done = st.pick !== null;
    var html = '<div class="progress-track" aria-hidden="true"><div class="progress-fill" style="width:' + Math.round(st.i / N * 100) + '%"></div></div>' +
      '<div class="q-meta"><span>第 ' + (st.i + 1) + ' / ' + N + ' 題</span><span class="cat-chip">' + esc(cat.label) + '</span></div>' +
      '<p class="scene">' + esc(q.scene) + '</p>' +
      (q.line ? '<p class="line">' + esc(q.line) + '</p>' : '') +
      '<p class="prompt">這裡藏的是哪一招？</p><div class="opts">';
    st.order[st.i].forEach(function (k) {
      var cls = 'opt';
      if (done) cls += k === 0 ? ' is-correct' : (k === st.pick ? ' is-wrong' : ' is-dim');
      html += '<button class="' + cls + '" type="button" data-k="' + k + '"' + (done ? ' disabled' : '') + '>' + esc(q.options[k]) + '</button>';
    });
    html += '</div>';
    if (done) {
      var ok = st.pick === 0;
      html += '<div class="explain">' +
        '<p class="verdict ' + (ok ? 'ok' : 'bad') + '">' + (ok ? '✅ 看穿了！這是「' : '❌ 這招是「') + esc(q.options[0]) + '」</p>' +
        '<p class="why">' + esc(q.why) + '</p>' +
        '<p class="book-def"><b>📖 書中原句</b>' + esc(q.bookDef) + '</p>' +
        '<p class="src">出處：《明辨》' + esc(q.sec) + '〈' + esc(q.secTitle) + '〉</p>' +
        '<div class="nav"><button class="btn" type="button" data-act="next">' + (st.i + 1 < N ? '下一題 ➔' : '看結果 ➔') + '</button></div>' +
        '</div>';
    }
    return html;
  }

  function stats() {
    var by = {};
    CAT_ORDER.forEach(function (c) { by[c] = { ok: 0, all: 0 }; });
    Q.forEach(function (q, i) { by[q.cat].all++; if (st.right[i]) by[q.cat].ok++; });
    return by;
  }

  function renderResult() {
    var score = st.right.filter(Boolean).length, by = stats(), R = MIRROR.results;
    var level = score >= R.high.min ? R.high : score >= R.mid.min ? R.mid : R.low;
    // 最弱的一類：正確率最低；同分照書的順序（第 7 → 8 → 9 章）
    var weak = null;
    CAT_ORDER.forEach(function (c) { var r = by[c].ok / by[c].all; if (r < 1 && (weak === null || r < by[weak].ok / by[weak].all)) weak = c; });
    var html = '<div class="progress-track" aria-hidden="true"><div class="progress-fill" style="width:100%"></div></div>' +
      '<p class="score"><b>' + score + '</b><span>／ ' + N + ' 題看穿</span></p>' +
      '<p class="level-title">' + esc(level.title) + '</p>' +
      '<p class="msg">' + esc(level.msg) + '</p>' +
      '<div class="dims"><p class="dims-title">📊 三種招式，你各看穿幾題</p>';
    CAT_ORDER.forEach(function (c) {
      var cat = MIRROR.categories[c], b = by[c];
      html += '<div><div class="dim-row"><span>' + esc(cat.label) + '</span><span>' + b.ok + ' / ' + b.all + '</span></div>' +
        '<div class="dim-bar"><i style="width:' + Math.round(b.ok / b.all * 100) + '%"></i></div></div>';
    });
    html += '</div>';
    var chap;
    if (weak) {
      var w = MIRROR.categories[weak];
      html += '<p class="weak">你最容易被帶走的是 <b>' + esc(w.label) + '</b>：' + esc(w.desc) + '。</p>';
      chap = '第 ' + w.chapter + ' 章〈' + w.chapterTitle + '〉';
    } else {
      chap = '第 ' + MIRROR.perfect.chapter + ' 章〈' + MIRROR.perfect.chapterTitle + '〉';
    }
    html += '<div class="book-rec-box">' +
      '<img src="' + BOOK.cover + '" alt="《明辨》書封" class="book-rec-cover" width="72" height="108" loading="lazy" decoding="async">' +
      '<div><p class="book-rec-name">' + BOOK.name + '</p><p class="book-rec-price">' + BOOK.price + '<span class="nowrap">' + BOOK.priceNote + '</span></p>' +
      '<p class="book-rec-reason">' + esc(BOOK.reason) + '</p>' +
      '<p class="chapters-title">🔑 ' + (weak ? '先讀這一章：' : '全對的話，接著讀這一章：') + '</p>' +
      '<ul class="chapters-list"><li>' + esc(chap) + '</li></ul></div></div>' +
      '<a class="cta-btn" href="' + BOOK.href + '" onclick="trackStoreClick(\'goto\', \'照妖鏡-書卡\')"><span>直達《明辨》：把難題拆開，把假話看穿</span><span>➔</span></a>' +
      '<p class="store-label">三大電子書城直接解鎖：</p><div class="store-grid">';
    BOOK.stores.forEach(function (s) {
      html += '<a class="store-chip" href="' + esc(s[2]) + '" target="_blank" rel="noopener" onclick="trackStoreClick(\'' + s[0] + '\', \'照妖鏡-直接購\')">' + s[1] + '</a>';
    });
    html += '</div><div class="after"><button class="linkish" type="button" data-act="restart">再照一次（選項順序會重新打亂）</button>' +
      '<a class="goto" href="book-quiz.html?book=mingbian">已經讀過《明辨》？做讀後小測驗 →</a></div>';
    return html;
  }

  function render() { card.innerHTML = st.i < 0 ? renderIntro() : st.i < N ? renderQuestion() : renderResult(); }
  function show() {
    render();
    try { card.focus({ preventScroll: true }); } catch (e) { card.focus(); }
    var r = card.getBoundingClientRect();
    if (r.top < 0 || r.top > window.innerHeight * 0.55) card.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
  }

  card.addEventListener('click', function (e) {
    var t = e.target && e.target.closest ? e.target.closest('button') : null;
    if (!t || !card.contains(t) || t.disabled) return;
    if (t.hasAttribute('data-k')) {
      st.pick = Number(t.getAttribute('data-k'));
      st.right[st.i] = st.pick === 0;
      render();
      return;
    }
    var act = t.getAttribute('data-act');
    if (act === 'start' || act === 'restart') { reset(); st.i = 0; track('mirror-start'); show(); }
    else if (act === 'next') {
      st.i += 1; st.pick = null;
      if (st.i >= N) track('mirror-done-' + st.right.filter(Boolean).length);
      show();
    }
  });

  reset();
  render();
})();

// 追蹤：失敗也絕不擋住跳轉
function trackStoreClick(store, book) {
  try {
    if (!window.clarity) return;
    clarity('event', 'click-' + store + '-' + book);
  } catch (e) {}
}
</script>

<script>
/* ──────────────────────────────────────────────────────────────
   圖片 CDN 退路：jsDelivr 掛掉時自動改用同 repo 的本地 assets/
   - 涵蓋靜態 <img>、JS 後來插入的 <img>、以及 CSS 背景圖
   - 只在載入失敗時才動作，正常情況完全沒有成本
   ────────────────────────────────────────────────────────────── */
(function () {
  var CDN = 'https://cdn.jsdelivr.net/gh/whitebear-jerry/life-os-mvp@6d0f0350f19556757ec8ea5353c53879b219660d/assets/';
  function toLocal(u) {
    if (!u) return null;
    var i = u.indexOf(CDN);
    return i === -1 ? null : 'assets/' + u.slice(i + CDN.length);
  }
  function guard(img) {
    if (!img || img.dataset.cdnFb) return;
    img.dataset.cdnFb = '1';
    img.addEventListener('error', function () {
      var l = toLocal(img.src);
      if (l) img.src = l;                 // 換本地路徑後不再重試，避免無限迴圈
    });
    // 腳本載入前就已失敗的圖，補救一次
    if (img.complete && img.naturalWidth === 0) {
      var l = toLocal(img.src);
      if (l) img.src = l;
    }
  }
  [].forEach.call(document.images, guard);

  // JS 後來才插進 DOM 的圖（閱讀地圖、工具頁的推薦書封都是這種）
  if (window.MutationObserver) {
    new MutationObserver(function (ms) {
      ms.forEach(function (m) {
        [].forEach.call(m.addedNodes, function (n) {
          if (!n || n.nodeType !== 1) return;
          if (n.tagName === 'IMG') guard(n);
          else if (n.querySelectorAll) [].forEach.call(n.querySelectorAll('img'), guard);
        });
      });
    }).observe(document.documentElement, { childList: true, subtree: true });
  }

  // CSS 背景圖沒有 error 事件，改用探測：載不起來就把元素的背景換成本地路徑
  window.__cdnBgFallback = function (el, url) {
    var probe = new Image();
    probe.onerror = function () {
      var l = toLocal(url);
      if (l) el.style.backgroundImage = "url('" + l + "')";
    };
    probe.src = url;
  };
})();
</script>
