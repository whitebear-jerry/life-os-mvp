(function () {
  function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function track(name) {
    try { if (window.clarity) clarity('event', name); } catch (e) {}
  }

  var key = null;
  try { key = new URLSearchParams(location.search).get('book'); } catch (e) {}
  if (!QUIZZES[key]) key = Object.keys(QUIZZES)[0];
  var Q = QUIZZES[key];
  var N = Q.questions.length;
  var MARK = ['A', 'B', 'C', 'D', 'E', 'F'];

  document.title = '《' + Q.title + '》讀後小測驗｜白熊人生攻略';
  document.getElementById('title').textContent = '《' + Q.title + '》讀後小測驗';
  document.getElementById('lead').textContent = N + ' 題生活情境題，大約 5 分鐘。每題作答後，會告訴你為什麼，以及出自書中哪一節。';
  var cover = document.getElementById('cover');
  cover.src = Q.cover;
  cover.alt = '《' + Q.title + '》封面';

  var card = document.getElementById('quiz');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var st;

  function shuffled(n) {
    // 正確答案在原始資料裡都排第一個，每次作答都要打亂
    var a = [];
    for (var i = 0; i < n; i++) a.push(i);
    for (var j = n - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1));
      var t = a[j]; a[j] = a[k]; a[k] = t;
    }
    return a;
  }

  function reset() {
    st = { i: -1, sel: [], answered: false, right: [], order: Q.questions.map(function (q) { return shuffled(q.options.length); }) };
  }

  function secLabel(s) {
    var t = Q.sections[s];
    return s + (t ? '〈' + t + '〉' : '');
  }

  function isRight(q, sel) {
    var want = [];
    q.options.forEach(function (o, k) { if (o.ok) want.push(k); });
    if (want.length !== sel.length) return false;
    return want.every(function (k) { return sel.indexOf(k) !== -1; });
  }

  function renderIntro() {
    return '<p class="note">不是考試。答錯的題目，就是最值得回去重讀的那一節。</p>' +
      '<div class="nav"><button class="btn" type="button" data-act="start">開始，共 ' + N + ' 題</button></div>';
  }

  function renderQuestion() {
    var q = Q.questions[st.i];
    var order = st.order[st.i];
    var html = '<div class="progress" role="progressbar" aria-label="作答進度" aria-valuemin="0" aria-valuemax="' + N + '" aria-valuenow="' + st.i + '">' +
      '<i style="width:' + Math.round(st.i / N * 100) + '%"></i></div>' +
      '<p class="step"><span>第 ' + (st.i + 1) + ' 題，共 ' + N + ' 題</span>' + (q.multi ? '<span class="tag-multi">複選</span>' : '') + '</p>' +
      '<p class="q">' + esc(q.q) + '</p><div class="opts">';
    order.forEach(function (k, pos) {
      var o = q.options[k];
      var picked = st.sel.indexOf(k) !== -1;
      var cls = 'opt';
      if (st.answered) {
        if (o.ok) cls += ' is-correct';
        else if (picked) cls += ' is-wrong';
        else cls += ' is-dim';
      }
      html += '<button class="' + cls + '" type="button" data-k="' + k + '" aria-pressed="' + picked + '"' + (st.answered ? ' disabled' : '') + '>' +
        '<span class="mk">' + MARK[pos] + '</span><span>' + esc(o.text) + '</span></button>';
    });
    html += '</div>';

    if (!st.answered) {
      if (q.hint) html += '<details class="hint"><summary>需要提示？</summary><p>' + esc(q.hint) + '</p></details>';
      if (q.multi) {
        html += '<div class="nav"><span class="note">可以選不只一個，選好再按確認。</span>' +
          '<button class="btn" type="button" data-act="check"' + (st.sel.length ? '' : ' disabled') + '>確認答案</button></div>';
      }
    } else {
      var ok = st.right[st.i];
      html += '<div class="explain"><p class="verdict ' + (ok ? 'ok' : 'bad') + '">' + (ok ? '答對了！' : '這題再想想') + '</p>';
      order.forEach(function (k, pos) {
        var o = q.options[k];
        if (!o.ok && st.sel.indexOf(k) === -1) return;
        var tag = o.ok ? '✓ 正確答案' : '✗ 你選的';
        html += '<p class="why"><b>' + MARK[pos] + '　' + tag + '</b><span>' + esc(o.why) + '</span></p>';
      });
      html += '<p class="src"><em>出處</em>《' + esc(Q.title) + '》' + q.secs.map(function (s) { return esc(secLabel(s)); }).join('、') + '</p></div>' +
        '<div class="nav"><span></span><button class="btn" type="button" data-act="next">' + (st.i + 1 < N ? '下一題 →' : '看結果') + '</button></div>';
    }
    return html;
  }

  function renderResult() {
    var score = st.right.filter(Boolean).length;
    var msg = score >= 9 ? '這本書你讀得很透，裡面的工具已經是你的了。'
      : score >= 6 ? '大部分都掌握了。下面這幾節回去翻一下，就更完整了。'
      : (Q.encourage || '沒關係，答錯的地方就是最值得重讀的那幾節，先從下面開始。');
    var secs = [];
    Q.questions.forEach(function (q, i) {
      if (st.right[i]) return;
      q.secs.forEach(function (s) { if (secs.indexOf(s) === -1) secs.push(s); });
    });
    secs.sort(function (a, b) {
      var x = a.split('.').map(Number), y = b.split('.').map(Number);
      for (var i = 0; i < Math.max(x.length, y.length); i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) - (y[i] || 0); }
      return 0;
    });
    var html = '<div class="progress" aria-hidden="true"><i style="width:100%"></i></div>' +
      '<p class="score"><b>' + score + '</b><span>／ ' + N + ' 題答對</span></p>' +
      '<p class="msg">' + esc(msg) + '</p>';
    if (secs.length) {
      html += '<div class="review"><h3>回去重讀這幾節</h3><ul>' +
        secs.map(function (s) { return '<li><span class="sec">' + esc(s) + '</span>' + esc(Q.sections[s] || '') + '</li>'; }).join('') +
        '</ul></div>';
    }
    if (Q.next) html += '<p class="next">' + esc(Q.next) + ' <a class="goto" href="reading-map.html">看閱讀地圖 →</a></p>';
    html += '<div class="nav"><button class="link" type="button" data-act="restart">再做一次（選項順序會重新打亂）</button></div>';
    return html;
  }

  function render() {
    card.innerHTML = st.i < 0 ? renderIntro() : st.i < N ? renderQuestion() : renderResult();
  }

  function show() {
    render();
    try { card.focus({ preventScroll: true }); } catch (e) { card.focus(); }
    var r = card.getBoundingClientRect();
    if (r.top < 0 || r.top > window.innerHeight * 0.55) {
      card.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
    }
  }

  function settle() {
    st.answered = true;
    st.right[st.i] = isRight(Q.questions[st.i], st.sel);
  }

  card.addEventListener('click', function (e) {
    var t = e.target && e.target.closest ? e.target.closest('button') : null;
    if (!t || !card.contains(t) || t.disabled) return;
    var act = t.getAttribute('data-act');
    if (t.hasAttribute('data-k')) {
      var k = Number(t.getAttribute('data-k'));
      var q = Q.questions[st.i];
      if (q.multi) {
        var at = st.sel.indexOf(k);
        if (at === -1) st.sel.push(k); else st.sel.splice(at, 1);
        render();
      } else {
        st.sel = [k];
        settle();
        render();
      }
      return;
    }
    if (act === 'start' || act === 'restart') {
      reset();
      st.i = 0;
      track('bookquiz-' + key + '-start');
      show();
    } else if (act === 'check') {
      settle();
      render();
    } else if (act === 'next') {
      st.i += 1;
      st.sel = [];
      st.answered = false;
      if (st.i >= N) track('bookquiz-' + key + '-done-' + st.right.filter(Boolean).length);
      show();
    }
  });

  reset();
  render();
})();
</script>

<script>
/* ──────────────────────────────────────────────────────────────
   圖片 CDN 退路：jsDelivr 掛掉時自動改用同 repo 的本地 assets/
   - 涵蓋靜態 <img>、JS 後來插入的 <img>、以及 CSS 背景圖
   - 只在載入失敗時才動作，正常情況完全沒有成本
   ────────────────────────────────────────────────────────────── */
(function () {
  var CDN = 'https://cdn.jsdelivr.net/gh/whitebear-jerry/life-os-mvp@7631055693f4cb949ae20810db76b618d638e670/assets/';
  function toLocal(u) {
    if (!u) return null;
    var i = u.indexOf(CDN);
    return i === -1 ? null : 'assets/' + u.slice(i + CDN.length);
  }
  function guard(img) {
    if (!img || img.dataset.cdnFb) return;
    img.dataset.cdnFb = '1';
    img.addEventListener('error', function () {
      var l = toLocal(img.src);
      if (l) img.src = l;                 // 換本地路徑後不再重試，避免無限迴圈
    });
    // 腳本載入前就已失敗的圖，補救一次
    if (img.complete && img.naturalWidth === 0) {
      var l = toLocal(img.src);
      if (l) img.src = l;
    }
  }
  [].forEach.call(document.images, guard);

  // JS 後來才插進 DOM 的圖（閱讀地圖、工具頁的推薦書封都是這種）
  if (window.MutationObserver) {
    new MutationObserver(function (ms) {
      ms.forEach(function (m) {
        [].forEach.call(m.addedNodes, function (n) {
          if (!n || n.nodeType !== 1) return;
          if (n.tagName === 'IMG') guard(n);
          else if (n.querySelectorAll) [].forEach.call(n.querySelectorAll('img'), guard);
        });
      });
    }).observe(document.documentElement, { childList: true, subtree: true });
  }

  // CSS 背景圖沒有 error 事件，改用探測：載不起來就把元素的背景換成本地路徑
  window.__cdnBgFallback = function (el, url) {
    var probe = new Image();
    probe.onerror = function () {
      var l = toLocal(url);
      if (l) el.style.backgroundImage = "url('" + l + "')";
    };
    probe.src = url;
  };
})();
</script>
