<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>白熊金句圖卡模板</title>
  <style>
    html,
    body {
      width: 1080px;
      height: 1080px;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #0c1511 0%, #17201a 58%, #2f6b4f 100%);
      color: #f7f7f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      width: 820px;
    }

    .brand {
      margin-bottom: 44px;
      color: #c48935;
      font-size: 34px;
      font-weight: 900;
    }

    .quote {
      font-size: 74px;
      font-weight: 900;
      line-height: 1.24;
      letter-spacing: 0;
    }

    .footer {
      margin-top: 48px;
      color: rgba(247, 247, 240, 0.72);
      font-size: 28px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">白熊人生攻略</div>
    <div class="quote">{{QUOTE}}</div>
    <div class="footer">把人生變成可以升級的作業系統</div>
  </main>
</body>
</html>
