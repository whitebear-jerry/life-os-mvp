<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IG Card Direction A - Notion</title>
  <style>
    :root {
      --green: #1a4d3a;
      --gold: #c48935;
      --ivory: #fdfdfb;
      --ink: #1a1a1a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #ece9e2;
      font-family: "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
    }

    .card {
      position: relative;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      color: var(--ink);
      background:
        linear-gradient(rgba(196, 137, 53, 0.16) 1px, transparent 1px),
        linear-gradient(90deg, rgba(196, 137, 53, 0.16) 1px, transparent 1px),
        radial-gradient(circle, rgba(26, 77, 58, 0.2) 1.35px, transparent 1.45px),
        var(--ivory);
      background-size: 216px 216px, 216px 216px, 24px 24px, auto;
      box-shadow: 0 28px 72px rgba(26, 26, 26, 0.18);
    }

    .card::before,
    .card::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }

    .card::before {
      inset: 60px;
      border: 2px solid rgba(196, 137, 53, 0.44);
    }

    .card::after {
      left: 126px;
      right: 126px;
      top: 246px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(196, 137, 53, 0.52), transparent);
    }

    .align-mark {
      position: absolute;
      left: 126px;
      top: 168px;
      width: 112px;
      height: 1px;
      background: var(--gold);
      opacity: 0.8;
    }

    .content {
      position: absolute;
      left: 126px;
      right: 126px;
      top: 300px;
    }

    .eyebrow {
      margin: 0 0 84px;
      color: var(--green);
      font-size: 30px;
      font-weight: 600;
      letter-spacing: 0;
    }

    .quote {
      margin: 0;
      color: var(--green);
      font-size: 86px;
      line-height: 1.24;
      font-weight: 800;
      letter-spacing: 0;
    }

    .note {
      margin: 88px 0 0;
      max-width: 640px;
      color: rgba(26, 26, 26, 0.76);
      font-size: 34px;
      line-height: 1.75;
      font-weight: 400;
      letter-spacing: 0;
    }

    .footer {
      position: absolute;
      left: 90px;
      right: 90px;
      bottom: 78px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 48px;
      color: var(--green);
    }

    .handle {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .book {
      color: var(--gold);
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0;
    }
  </style>
</head>
<body>
  <main class="card" aria-label="白熊人生攻略 IG 金句卡">
    <div class="align-mark" aria-hidden="true"></div>
    <section class="content">
      <p class="eyebrow">白熊人生攻略｜醒腦練習</p>
      <h1 class="quote">你不是不努力，是人生雜訊太多。</h1>
      <p class="note">真正該做的，不是把自己逼到更用力，而是先替大腦降噪，把主導權拿回來。</p>
    </section>
    <footer class="footer">
      <div class="handle">@baixiong.lifeos + 🐻‍❄️</div>
      <div class="book">《降噪人生》</div>
    </footer>
  </main>
</body>
</html>
