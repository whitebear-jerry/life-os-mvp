<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IG Card Direction B - Watermark</title>
  <style>
    :root {
      --green: #1a4d3a;
      --gold: #c48935;
      --ivory: #fdfdfb;
      --ink: #1a1a1a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #ece9e2;
      font-family: "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
    }

    .card {
      position: relative;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(253, 253, 251, 0.96), rgba(246, 242, 232, 0.98)),
        var(--ivory);
      box-shadow: 0 28px 72px rgba(26, 26, 26, 0.18);
    }

    .soft-panel {
      position: absolute;
      inset: 72px;
      border: 1px solid rgba(26, 77, 58, 0.14);
      background: rgba(253, 253, 251, 0.48);
    }

    .bear-mark {
      position: absolute;
      right: -152px;
      bottom: 110px;
      width: 760px;
      height: 760px;
      color: var(--green);
      opacity: 0.075;
    }

    .gold-rule {
      position: absolute;
      left: 126px;
      top: 164px;
      width: 178px;
      height: 4px;
      background: var(--gold);
    }

    .content {
      position: absolute;
      left: 126px;
      right: 126px;
      top: 300px;
    }

    .eyebrow {
      margin: 0 0 84px;
      color: rgba(26, 77, 58, 0.82);
      font-size: 30px;
      font-weight: 600;
      letter-spacing: 0;
    }

    .quote {
      margin: 0;
      max-width: 780px;
      color: var(--green);
      font-size: 86px;
      line-height: 1.24;
      font-weight: 800;
      letter-spacing: 0;
    }

    .note {
      margin: 88px 0 0;
      max-width: 640px;
      color: rgba(26, 26, 26, 0.76);
      font-size: 34px;
      line-height: 1.75;
      font-weight: 400;
      letter-spacing: 0;
    }

    .footer {
      position: absolute;
      left: 90px;
      right: 90px;
      bottom: 78px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 48px;
      color: var(--green);
    }

    .handle {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .book {
      color: var(--gold);
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0;
    }
  </style>
</head>
<body>
  <main class="card" aria-label="白熊人生攻略 IG 金句卡">
    <div class="soft-panel" aria-hidden="true"></div>
    <svg class="bear-mark" viewBox="0 0 600 600" aria-hidden="true">
      <path fill="currentColor" d="M176 150c-35-6-68 20-72 56-2 17 3 34 13 47-31 29-50 72-50 121 0 96 76 174 170 174h126c94 0 170-78 170-174 0-49-19-92-50-121 10-13 15-30 13-47-4-36-37-62-72-56-21 4-39 19-48 38-24-10-50-15-76-15s-52 5-76 15c-9-19-27-34-48-38Zm-10 48c14 0 26 12 26 26 0 8-4 16-10 21-10 8-25 7-34-2-10-10-10-27 0-37 5-5 12-8 18-8Zm268 0c6 0 13 3 18 8 10 10 10 27 0 37-9 9-24 10-34 2-6-5-10-13-10-21 0-14 12-26 26-26ZM300 237c62 0 113 51 113 114 0 64-51 115-113 115s-113-51-113-115c0-63 51-114 113-114Zm-50 83c-13 0-23 11-23 24s10 24 23 24 23-11 23-24-10-24-23-24Zm100 0c-13 0-23 11-23 24s10 24 23 24 23-11 23-24-10-24-23-24Zm-49 55c-15 0-31 9-41 22-4 6 0 14 8 14h66c8 0 12-8 8-14-10-13-26-22-41-22Z"/>
    </svg>
    <div class="gold-rule" aria-hidden="true"></div>
    <section class="content">
      <p class="eyebrow">白熊人生攻略｜醒腦練習</p>
      <h1 class="quote">你不是不努力，是人生雜訊太多。</h1>
      <p class="note">真正該做的，不是把自己逼到更用力，而是先替大腦降噪，把主導權拿回來。</p>
    </section>
    <footer class="footer">
      <div class="handle">@baixiong.lifeos + 🐻‍❄️</div>
      <div class="book">《降噪人生》</div>
    </footer>
  </main>
</body>
</html>
