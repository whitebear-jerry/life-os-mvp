  if (PLAYLIST) {
    document.getElementById('playall').outerHTML = '<a class="playall" href="https://www.youtube.com/playlist?list=' + PLAYLIST +
      '" target="_blank" rel="noopener">在 YouTube 依序播放全部 40 支 →</a>';
  }
  var parts = [];
  VIDEOS.forEach(function (v) {
    var last = parts[parts.length - 1];
    if (!last || last.name !== v.part) parts.push({ name: v.part, items: [] });
    parts[parts.length - 1].items.push(v);
  });
  document.getElementById('index').innerHTML = parts.map(function (p, i) {
    return '<div class="index-part"><b>' + esc(partName(p.name)) + '</b><div>' + p.items.map(function (v) {
      return '<a href="#v' + v.n + '" class="num" aria-label="第 ' + Number(v.n) + ' 支">' + v.n + '</a>';
    }).join('') + '</div></div>';
  }).join('');
  document.getElementById('list').innerHTML = parts.map(function (p, i) {
    return '<h2 class="part" id="p' + (i + 1) + '">' + esc(p.name) + '</h2>' + p.items.map(function (v) {
      var thumb = v.id ? 'https://i.ytimg.com/vi/' + v.id + '/hqdefault.jpg' : v.thumb;
      return '<article class="video" id="v' + v.n + '">' +
        '<div class="video-head"><span class="n">' + v.n + '</span><h3>' + esc(v.topic) + '</h3><span class="dur">' + v.dur + '</span></div>' +
        '<ul class="chapters"><li><span class="sec">' + esc(v.sec) + '</span>' + esc(v.chapter) + '</li></ul>' +
        '<div class="player"><button type="button" data-id="' + (v.id || '') + '" data-local="' + esc(v.local || '') + '" data-n="' + v.n +
          '" aria-label="播放 ' + esc(v.sec) + '：' + esc(v.topic) + '">' +
          '<img src="' + esc(thumb) + '" alt="" loading="lazy" decoding="async"><span class="play" aria-hidden="true"></span></button></div>' +
        '<p class="try"><b>看完試試看</b>' + esc(v.try) + (v.tryRef ? '<span>（' + esc(v.tryRef) + '）</span>' : '') + '</p>' +
      '</article>';
    }).join('');
  }).join('');

  document.getElementById('list').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.player button') : null;
    if (!b) return;
    var f;
    if (b.dataset.id) {
      f = document.createElement('iframe');
      f.src = 'https://www.youtube-nocookie.com/embed/' + b.dataset.id + '?autoplay=1&rel=0&playsinline=1';
      f.title = b.getAttribute('aria-label').replace('播放 ', '');
      f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
      f.allowFullscreen = true;
    } else if (b.dataset.local) {
      f = document.createElement('video');
      f.src = b.dataset.local; f.controls = true; f.autoplay = true; f.playsInline = true;
    } else return;
    b.parentNode.replaceChild(f, b);
    try { if (window.clarity) clarity('event', 'youyi-video-' + b.dataset.n); } catch (err) {}
  });
})();
</script>

<script>
(function () {
  var CDN = 'https://cdn.jsdelivr.net/gh/whitebear-jerry/life-os-mvp@6d0f0350f19556757ec8ea5353c53879b219660d/assets/';
  function toLocal(u) {
    if (!u) return null;
    var i = u.indexOf(CDN);
    return i === -1 ? null : 'assets/' + u.slice(i + CDN.length);
  }
  function guard(img) {
    if (!img || img.dataset.cdnFb) return;
    img.dataset.cdnFb = '1';
    img.addEventListener('error', function () {
      var l = toLocal(img.src);
      if (l) img.src = l;
    });
    if (img.complete && img.naturalWidth === 0) {
      var l = toLocal(img.src);
      if (l) img.src = l;
    }
  }
  [].forEach.call(document.images, guard);
})();
</script>
